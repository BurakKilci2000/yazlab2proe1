<h1>Gebze'de evden hırsızlık</h1>
<div class="news-text">
<p>Gebze ilçesi Osman Yılmaz Mahallesi'nde bir eve giren hırsızlar ziynet eşyalarını çalarak kaçtı. Ev sahibi durumu fark edince polise haber verdi.</p>
<p>Polis ekipleri bölgedeki güvenlik kameralarını inceleyerek şüphelileri yakalamak için çalışma başlattı.</p>
